<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Chagall</title>
    <link rel="stylesheet" href="main.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top left, #f7d7ff 0%, #d5e7ff 40%, #f6f0ff 100%);
        }

        .auth-container {
            width: min(420px, calc(100vw - 40px));
            padding: 32px 28px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 28px;
            box-shadow: 0 18px 60px rgba(74, 100, 170, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(14px);
        }

        .auth-container h2 {
            margin: 0 0 20px;
            font-size: 1.9rem;
            letter-spacing: 0.02em;
            color: #2e3a66;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            margin: 12px 0;
            border: 1px solid rgba(110, 116, 150, 0.24);
            border-radius: 18px;
            background: #f9faff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            box-sizing: border-box;
            font-size: 0.98rem;
        }

        input:focus {
            outline: none;
            border-color: #a98cff;
            box-shadow: 0 0 0 4px rgba(169, 140, 255, 0.12);
            background: #ffffff;
        }

        .auth-btn {
            width: 100%;
            padding: 14px 16px;
            margin-top: 10px;
            background: linear-gradient(135deg, #ff7a9b, #ff5c8d);
            color: white;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .auth-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 26px rgba(255, 92, 141, 0.2);
        }

        p {
            margin-top: 18px;
            text-align: center;
            color: #5b607a;
            font-size: 0.96rem;
        }

        a {
            color: #6f5cff;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Đăng Nhập</h2>
        <form id="login-form">
            <input type="text" id="login-username" placeholder="Tên đăng nhập" required>
            <input type="password" id="login-password" placeholder="Mật khẩu" required>
            <button type="submit" class="auth-btn">Đăng nhập</button>
        </form>
        <p>Chưa có tài khoản? <a href="register.html">Đăng ký tại đây</a></p>
    </div>
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-left">© 2026 Chagall Anime Cinema</div>
            <div class="footer-right">
                <a href="#">Chính sách</a>
                <span>·</span>
                <a href="#">Điều khoản</a>
            </div>
        </div>
    </footer>
    <script src="login.js"></script>
</body>
</html>
