<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindX Cinema - Anime</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">MINDX-CINEMA</div>
            <div class="user-info">
                <span id="username-display">Chào, Otaku!</span>
                <button onclick="logout()">Đăng xuất</button>
            </div>
        </nav>
    </header>

    <main id="app-container">
        <section id="movie-list-section">
            <h1 class="section-title">Anime Hot - Nhiều Thể Loại</h1>

            <!-- Ô tìm kiếm -->
            <div class="search-box">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Nhập tên anime..."
                    onkeydown="handleSearchKey(event)"
                >
                <button class="btn-search" onclick="searchAnime()">
                    <i class="fas fa-search"></i> Tìm
                </button>
            </div>

            <!-- Nút lọc thể loại -->
            <div class="genre-buttons">
                <button onclick="showDefault()">Tất cả</button>
                <button onclick="loadAnimeFromJikan('romcom')">Rom-Com</button>
                <button onclick="loadAnimeFromJikan('action')">Action</button>
                <button onclick="loadAnimeFromJikan('top')">Top Anime</button>
            </div>

            <div id="movie-grid" class="movie-grid">
                <!-- Danh sách anime sẽ hiện ở đây -->
            </div>
        </section>

        <section id="movie-detail-section" class="hidden">
            <button class="back-btn" onclick="closeDetail()">
                <i class="fas fa-arrow-left"></i> Quay lại
            </button>
            <div id="detail-content"></div>
        </section>
    </main>
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-left">© 2026 SAygex</div>
            <div class="footer-right">
                <a href="#">Chính sách</a>
                <span>·</span>
                <a href="#">Điều khoản</a>
            </div>
        </div>
    </footer>

    <script>
        window.embeddedChatbotConfig = {
            chatbotId: "HEq0i4Yd49ULTBjJWqMPx",
            domain: "www.chatbase.co"
        };
    </script>
    <script
        src="https://www.chatbase.co/embed.min.js"
        chatbotId="HEq0i4Yd49ULTBjJWqMPx"
        domain="www.chatbase.co"
        defer>
    </script>

    <script src="main.js"></script>
</body>
</html>
